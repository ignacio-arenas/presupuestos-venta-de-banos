name: Descargar, procesar y publicar

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Datos de Hacienda (CONPREL)", "Contratos (Plataforma de Contratación)"]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: "17 6 1 * *" # día 1 de cada mes, por si el Ayuntamiento sube PDFs nuevos

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests del parser
        run: pytest -q tests
      - name: Descargar PDFs
        run: python scripts/download.py
      - name: Extraer datos
        run: python scripts/parse.py
      - name: Resumir datos de Hacienda
        run: python scripts/hacienda.py
      - name: Alertas de contratación
        run: python scripts/alertas.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
